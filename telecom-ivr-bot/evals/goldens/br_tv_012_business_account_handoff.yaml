conversations:
- conversation: br_tv_012_business_account_handoff
  turns:
  - user: <event>welcome</event>
    agent: Welcome to Telco. I can help with billing, technical support, or managing
      your account. To get started, could you tell me the phone number or account
      number associated with your service? This call may be recorded for quality and
      training purposes.
  - user: I want to add a new business phone line.
    agent: To get you the best support for your business account, I'll transfer you
      to an agent. You'll need to use your phone keypad instead of talking to the
      virtual assistant. Just a moment while I connect you.
    tool_calls:
    - action: execute_live_agent_handover
      args:
        reason: business_handoff
    - action: end_session
      args:
        session_escalated: true
  expectations:
  - The agent must emit verbatim business_handoff line for business accounts
  - The agent must escalate immediately without attempting self-service
  mocks: []
  tags:
  - P0
  - HIGH
  - business-deflection
  - BR-TV-012
  - compliance_goldens
  session_parameters:
    language: primary
    mock_mode: 'True'
    clid: '5559876543'
    business_flag: 'true'
    tfn: '8005550199'
